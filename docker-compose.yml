services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    env_file: .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - council-net

  seed-config:
    build:
      context: .
      dockerfile: Dockerfile.council
    command: ["config"]
    environment:
      - COUNCIL_AGENTS_DIR=/app/agents
      - COUNCIL_CONFIG_PATH=/app/council.toml
      - LITELLM_CONFIG_OUTPUT=/config/litellm_config.yaml
    volumes:
      - litellm-config:/config
    networks:
      - council-net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - litellm-config:/config:ro
    command: ["--config", "/config/litellm_config.yaml", "--port", "4000"]
    env_file: .env
    depends_on:
      seed-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - council-net

  seed-deploy:
    build:
      context: .
      dockerfile: Dockerfile.council
    command: ["deploy"]
    env_file: .env
    environment:
      - N8N_API_URL=http://n8n:5678
      - COUNCIL_AGENTS_DIR=/app/agents
      - COUNCIL_CONFIG_PATH=/app/council.toml
      - COUNCIL_ACTIVATE=true
    depends_on:
      n8n:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - council-net

  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - N8N_API_URL=http://n8n:5678
      - MCP_MODE=http
      - AUTH_TOKEN=${MCP_AUTH_TOKEN:-local-dev-token}
      - WEBHOOK_SECURITY_MODE=moderate
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - council-net

networks:
  council-net:

volumes:
  litellm-config:
