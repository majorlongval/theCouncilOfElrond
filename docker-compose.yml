services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    env_file: .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - council-net

  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - N8N_API_URL=http://n8n:5678
      - WEBHOOK_SECURITY_MODE=moderate
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - council-net

  seed:
    image: alpine:3.19
    volumes:
      - ./workflows:/workflows:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-workflows.sh"]
    env_file: .env
    environment:
      - N8N_API_URL=http://n8n:5678
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - council-net

networks:
  council-net:
